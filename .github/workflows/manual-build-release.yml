name: Manual Build and Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build only, or build and publish a GitHub Release
        required: true
        default: build
        type: choice
        options:
          - build
          - release
      version:
        description: Version used for the JAR and release tag
        required: true
        default: 1.0.0
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build -Pmod_version="${{ inputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: NoMoreMod-Whitelist-${{ inputs.version }}
          path: build/libs/NoMoreMod-Whitelist-${{ inputs.version }}.jar
          if-no-files-found: error

      - name: Create GitHub Release and upload JAR
        if: inputs.operation == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
          JAR: build/libs/NoMoreMod-Whitelist-${{ inputs.version }}.jar
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=("$TAG" "$JAR" --title "NoMoreMod-Whitelist ${{ inputs.version }}" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
